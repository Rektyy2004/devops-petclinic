services:
  mysql:
    image: mysql:9.5
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_USER=petclinic
      - MYSQL_PASSWORD=petclinic
      - MYSQL_DATABASE=petclinic
    volumes:
      - "./conf.d:/etc/mysql/conf.d:ro"
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic  # or whatever password is expected
      POSTGRES_DB: petclinic
    ports:
      - "5432:5432"
